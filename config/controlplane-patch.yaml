machine:
  network:
    hostname: talos-control-plane
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 192.168.121.100
cluster:
  allowSchedulingOnControlPlanes: false
  apiServer:
    certSANs:
      - 192.168.121.100
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
