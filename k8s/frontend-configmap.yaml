apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: hajeer-test
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
    }
